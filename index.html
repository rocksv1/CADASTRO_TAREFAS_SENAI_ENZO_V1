<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="cartao-aplicacao">
        <img class="banner" src="banner.jpg" alt="Banner">
        <header class="cabecalho-aplicacao">
            <img class="foto" src="foto.jpg" alt="Minha foto">
            <div class="titulo-bloco">
                <h1>Minhas Tarefas</h1>
                <p class="subtitulo">Segunda, 05 de outubro</p>
            </div>
            <button class="botao-icone" id="botao-alternar-tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje??..." maxlength="40">
            <button class="botao-principal" id="botao-adicionar">
                <i class="fa-solid fa-plus"></i>Adicionar
            </button>
        </div>
        <div class="filtros" id="filtros">
            <button class="botao-filtro ativo" data-filtro="todas">Todas</button>
            <button class="botao-filtro" data-filtro="pendentes">Pendentes</button>
            <button class="botao-filtro" data-filtro="concluidas">Concluídas</button>
        </div>
        <ul class="lista-tarefas" id="lista-tarefas">
            <!-- As tarefas serao inseridas dinamicamente
             via JavaScript -->
        </ul>
        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">0 tarefas na lista</span>
            <button class="botao-limpar" id="botao-limpar" disabled>
                Limpar concluídas
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
